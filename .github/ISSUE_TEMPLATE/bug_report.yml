name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you ask the agent, what did it do, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Tool calls or steps to reproduce
      description: If you can, paste the tool calls and results (your agent can show them). A .meshmind project file helps a lot.
  - type: input
    id: version
    attributes:
      label: MeshMind version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      placeholder: "Claude Code, Codex, Cursor, ..."
